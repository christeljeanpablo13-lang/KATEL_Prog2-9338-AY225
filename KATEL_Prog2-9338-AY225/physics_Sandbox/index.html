<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Physics Sandbox Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Menu -->
    <div id="menu">
        <h1>Physics Sandbox</h1>
        <p>Build, simulate, and experiment with physics!</p>
        <button id="startBtn">Start Game</button>
    </div>

    <!-- UI BAR -->
    <div id="uiBar">
        <span id="infoText">Score: 0 / 3</span>
        <button id="resetBtn">Reset</button>
    </div>

    <!-- Win Screen -->
    <div id="winScreen">
        <h1>You Win!</h1>
        <button id="restartBtn">Restart</button>
    </div>

    <!-- Canvas -->
    <canvas id="gameCanvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
